

services:
  web:
    build: .
    container_name: django-only-backend
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8001:8000"  # Внешний порт 8001, внутри у Django всё равно 8000
    env_file:
      - .env.do
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: django-only-db
    env_file:
      - .env.do
    volumes:
      - pgdata_django_only:/var/lib/postgresql/data

volumes:
  pgdata_django_only:

