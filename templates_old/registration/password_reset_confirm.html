{% extends "csm/base.html" %}
{% load widget_tweaks %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white shadow-xl rounded-xl p-8">
  <h2 class="text-xl font-bold mb-6 text-center">Enter new password</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        {{ field|add_class:"w-full border rounded-lg px-3 py-2" }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">Change my password</button>
  </form>
</div>
{% endblock %}
