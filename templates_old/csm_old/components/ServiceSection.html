{% load static %}
<section id="services" class="bg-gray-900 px-4 py-24 text-yellow-100">
  <div class="container mx-auto max-w-6xl text-center">
    <h2 class="mb-12 text-4xl font-bold text-text hover:text-hover">Naše služby</h2>

    <div class="grid gap-8 md:grid-cols-3">
      {% for sluzba in nas_sluzby %}
        <div class="bg-gray-900 rounded-2xl border border-border p-8 text-yellow-100 hover:text-yellow-200 shadow-lg backdrop-blur-sm">
          <div class="flex h-full flex-col gap-4">
            <div class="mb-2 text-5xl">
              <svg class="w-10 h-10 mx-auto text-yellow-100" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24"><path d="M3 10h18v11H3z"/><path d="M8 21v-4h8v4"/></svg>
            </div>
            <h3 class="text-2xl font-semibold">{{ sluzba.title }}</h3>
            <p class="text-muted mb-4">{{ sluzba.description }}</p>

            {% if sluzba.property_type %}
              <a href="{{ sluzba.property_type }}"
                 class="inline-block rounded-full bg-orange-400 px-5 py-2 font-medium text-white shadow-md transition-colors duration-200 hover:bg-orange-500">
                Viac podrobností 
              </a>
            {% else %}
              <span class="text-sm text-red-400">Nie je k dispozícii</span>
            {% endif %}
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
