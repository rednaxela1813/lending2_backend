name: 🚀 Deploy Django-Only to VPS


on:
  push:
    branches:
      - django-only  # Деплой запускается только при пуше в django-only

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🔧 Запускаем деплой для ветки django-only..."
            bash /home/alex/django-only/deploy.sh
