services: db: image: postgres:16 restart: unless-stopped environment: POSTGRES_DB: ${POSTGRES_DB} POSTGRES_USER: ${POSTGRES_USER} POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} volumes: - ./volumes/db_data:/var/lib/postgresql/data healthcheck: test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"] interval: 5s timeout: 5s retries: 30 valkey: image: valkey/valkey:latest restart: unless-stopped command: ["valkey-server", "--appendonly", "yes"] volumes: - ./volumes/valkey_data:/data healthcheck: test: ["CMD", "valkey-cli", "ping"] interval: 5s timeout: 3s retries: 30 elasticsearch: build: ./elasticsearch restart: unless-stopped environment: - discovery.type=single-node - xpack.security.enabled=false - ES_JAVA_OPTS=${ES_JAVA_OPTS} ulimits: memlock: { soft: -1, hard: -1 } volumes: - ./volumes/es_data:/usr/share/elasticsearch/data healthcheck: test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"] interval: 10s timeout: 5s retries: 60 nextcloud: build: ./nextcloud restart: unless-stopped depends_on: db: { condition: service_healthy } valkey: { condition: service_started } elasticsearch: { condition: service_healthy } environment: POSTGRES_HOST: db POSTGRES_DB: ${POSTGRES_DB} POSTGRES_USER: ${POSTGRES_USER} POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER} NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD} NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS} REDIS_HOST: ${REDIS_HOST} REDIS_HOST_PORT: ${REDIS_PORT} volumes: - ./volumes/nextcloud_html:/var/www/html - ./volumes/nextcloud_data:/var/www/html/data ports: - "8080:80" healthcheck: test: ["CMD-SHELL", "curl -fsS http://localhost/status.php >/dev/null || exit 1"] interval: 10s timeout: 5s retries: 120 nc-cron: image: nextcloud:31-apache restart: unless-stopped depends_on: nextcloud: { condition: service_started } volumes: - ./volumes/nextcloud_html:/var/www/html - ./volumes/nextcloud_data:/var/www/html/data entrypoint: ["/cron.sh"] # штатный скрипт из образа environment: - CRON_PERIOD=60 # запуск cron.php каждую минуту (по умолчанию ~5 мин) nc-init: build: ./nextcloud depends_on: nextcloud: { condition: service_started } user: "33:33" volumes: - ./volumes/nextcloud_html:/var/www/html - ./volumes/nextcloud_data:/var/www/html/data - ./scripts/nc-init.sh:/nc-init.sh:ro entrypoint: ["/bin/sh","-lc"] command: "/nc-init.sh" restart: "no"