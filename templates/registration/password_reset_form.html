{% extends "csm/base.html" %}
{% load widget_tweaks %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white shadow-xl rounded-xl p-8">
  <h2 class="text-xl font-bold mb-6 text-center">Reset Password</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      {{ form.email|add_class:"w-full border rounded-lg px-3 py-2" }}
      {{ form.email.errors }}
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">Send reset link</button>
  </form>
</div>
{% endblock %}
