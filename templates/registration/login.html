{% extends "csm/base.html" %}
{% load widget_tweaks %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white shadow-xl rounded-xl p-8">
  <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      {{ form.username|add_class:"w-full border rounded-lg px-3 py-2" }}
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      {{ form.password|add_class:"w-full border rounded-lg px-3 py-2" }}
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">Sign in</button>
  </form>
  <p class="mt-4 text-sm text-center">
    <a href="{% url 'password_reset' %}" class="text-blue-600 hover:underline">Forgot password?</a>
  </p>
</div>
{% endblock %}
