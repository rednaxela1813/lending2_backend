{% extends "dashboard/base/layout.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Confirm delete</h1>
<p class="mb-6 text-gray-700">Вы уверены, что хотите удалить объект “{{ object }}”?</p>
<form method="post" class="flex gap-3">
  {% csrf_token %}
  <button class="px-4 py-2 bg-red-600 text-white rounded-lg">Delete</button>
  <a href="{{ request.META.HTTP_REFERER|default:'#' }}" class="px-4 py-2 border rounded-lg">Cancel</a>
</form>
{% endblock %}
