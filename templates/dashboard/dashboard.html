{% extends "csm/base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto mt-10">
  <div class="bg-white shadow-xl rounded-xl p-6">
    <h1 class="text-2xl font-bold mb-4">Личный кабинет</h1>
    <p class="text-gray-700 mb-6">
      Привет, <strong>{{ request.user.full_name|default:request.user.email }}</strong>!
    </p>

    <div class="grid md:grid-cols-2 gap-4">
      <a href="/pon_ka/" class="block p-4 border rounded-lg hover:bg-gray-50">
        <div class="text-sm text-gray-500">Админка</div>
        <div class="font-semibold">Перейти в админ-панель</div>
      </a>

      <a href="{% url 'password_change' %}" class="block p-4 border rounded-lg hover:bg-gray-50">
        <div class="text-sm text-gray-500">Безопасность</div>
        <div class="font-semibold">Сменить пароль</div>
      </a>

      <form method="post" action="{% url 'logout' %}" class="block p-4 border rounded-lg hover:bg-gray-50">
        {% csrf_token %}
        <div class="text-sm text-gray-500">Сессия</div>
        <button type="submit" class="font-semibold text-red-600">Выйти</button>
      </form>

      <a href="/" class="block p-4 border rounded-lg hover:bg-gray-50">
        <div class="text-sm text-gray-500">Сайт</div>
        <div class="font-semibold">На главную</div>
      </a>
    </div>
  </div>
</div>
{% endblock %}
