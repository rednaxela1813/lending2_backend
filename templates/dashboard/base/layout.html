{% extends "csm/base.html" %}
{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Dashboard{% endblock %}</title>
  <!-- Предполагаем, что Tailwind уже подключён в проекте -->
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-sans leading-normal tracking-normal">
  <nav class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="font-semibold">CMS Dashboard</div>
      <div class="space-x-4">
        <a class="text-sm hover:underline" href="{% url 'dashboard:home' %}">Home</a>
        <a class="text-sm hover:underline" href="{% url 'dashboard:text_list' %}">Texts</a>
        <a class="text-sm hover:underline" href="{% url 'dashboard:image_list' %}">Images</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
