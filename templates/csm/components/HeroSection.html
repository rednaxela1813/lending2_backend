{% load static %}
<section class="relative min-h-[88vh] flex items-center">
  <!-- BG -->
  <img src="{{ hero_section.image.url }}" alt=""
       class="absolute inset-0 -z-10 w-full h-full object-cover object-center">
  <div class="absolute inset-0 -z-10 bg-gradient-to-b from-black/60 via-black/40 to-black/25"></div>

  <!-- Content -->
  <div class="mx-auto max-w-7xl px-4 w-full text-center">
    <h1 class="text-5xl md:text-6xl font-light leading-tight tracking-tight text-white [text-shadow:0_4px_24px_rgba(0,0,0,.55)]">
      Combining the best of coworking and traditional offices
    </h1>
    <p class="mt-4 text-white/80">
      Ultra-flex terms, furnished offices, meeting rooms, receptionist — one monthly price.
    </p>
    <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
      <a href="/locations/" class="px-6 py-3 rounded-full border border-white/40 text-white hover:bg-white hover:text-black transition">
        Browse locations
      </a>
      <a href="#tour" class="px-6 py-3 rounded-full bg-white text-black font-medium hover:bg-white/90 transition">
        Schedule a tour
      </a>
    </div>
  </div>
</section>
