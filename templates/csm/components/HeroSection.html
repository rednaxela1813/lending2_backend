<!-- HERO -->
{% load static %}
<section class="hero min-h-dvh relative text-center">
  <img
    src="{% static 'images/hero_images/06_kancelaria68.jpg' %}"
    alt="" aria-hidden="true" loading="lazy"
    class="absolute inset-0 -z-10 w-full h-full object-cover">
  <div class="hero-overlay bg-gradient-to-b from-white/20 via-transparent to-transparent"></div>


  <div class="hero-content opacity-25">
    <div class="max-w-2xl glass rounded-2xl p-8 lg:p-10">
      <h1 class="text-5xl md:text-6xl font-light leading-tight tracking-tight">
        Combining the best of coworking and traditional offices
      </h1>
      <p class="mt-4 text-white/80 font-light leading-tight tracking-tight">
        Ultra-flex terms, furnished offices, meeting rooms, receptionist — one monthly price.
      </p>
      <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/locations/" class="btn btn-outline">Browse locations</a>
        <a href="#tour" class="btn btn-primary">Schedule a tour</a>
      </div>
    </div>
  </div>
</section>
