{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>{{ company.name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% tailwind_css %}

  <!-- Dynamic CSS variables for theme colors -->
  <style>
    :root {
      --navbar-bg: {{ theme_color.navbar_background }};
      --body-bg: {{ theme_color.body_background }};
      --footer-bg: {{ theme_color.footer_background }};

      --text-color: {{ theme_color.text_color }};
      --text-hover-color: {{ theme_color.text_hover_color }};

      --border-color: {{ theme_color.border_color }};
      --border-hover-color: {{ theme_color.border_hover_color }};

      --primary-color: {{ theme_color.primary_color }};
      --primary-hover-color: {{ theme_color.primary_hover_color }};
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body class="bg-body text-text relative">

  <!-- Main content -->
  {% block content %}{% endblock %}

  <!-- Floating Call/Message Button (mobile only) -->
  {% if is_working_hours %}
  <a id="call-button"
     href="tel:+421900000000"
     class="fixed bottom-6 right-6 z-50 rounded-full bg-green-500 bg-opacity-100 px-6 py-3 text-white text-lg shadow-lg transition hover:bg-green-600 focus:bg-green-700 active:bg-green-800 focus:outline-none">
     📞 Zavolať
  </a>
{% else %}
  <a id="call-button"
     href="#contact"
     class="fixed bottom-6 right-6 z-50 rounded-full bg-orange-400 bg-opacity-100 px-6 py-3 text-white text-lg shadow-lg transition hover:bg-orange-500 focus:bg-orange-600 active:bg-orange-700 focus:outline-none">
     ✉️ Napísať nám
  </a>
{% endif %}


  <!-- JavaScript -->
  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById("mobile-menu");
      menu.classList.toggle("hidden");
    }

    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const callBtn = document.getElementById("call-button");
      if (callBtn && !isMobile()) {
        callBtn.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
