{% load static %}
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>{{ company.name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="{% static 'css/style.css' %}" rel="stylesheet">

  <style>
    :root {
      --navbar-bg: {{ theme_color.navbar_background }};
      --body-bg: {{ theme_color.body_background }};
      --footer-bg: {{ theme_color.footer_background }};

      --text-color: {{ theme_color.text_color }};
      --text-hover-color: {{ theme_color.text_hover_color }};

      --border-color: {{ theme_color.border_color }};
      --border-hover-color: {{ theme_color.border_hover_color }};

      --primary-color: {{ theme_color.primary_color }};
      --primary-hover-color: {{ theme_color.primary_hover_color }};
    }

    /* background */
    .bg-body {
      background-color: var(--body-bg);
    }

    .bg-navbar {
      background-color: var(--navbar-bg);
    }

    .bg-footer {
      background-color: var(--footer-bg);
    }

    /* text */
    .text-text {
      color: var(--text-color);
    }

    .hover\:text-hover:hover {
      color: var(--text-hover-color);
    }

    /* borders */
    .border-border {
      border-color: var(--border-color);
    }

    .hover\:border-hover:hover {
      border-color: var(--border-hover-color);
    }

    /* primary color usage */
    .bg-primary {
      background-color: var(--primary-color);
    }

    .hover\:bg-primary-hover:hover {
      background-color: var(--primary-hover-color);
    }

    .text-primary {
      color: var(--primary-color);
    }

    .hover\:text-primary:hover {
      color: var(--primary-color);
    }
    .text-secondary-text {
  color: var(--color-secondary-text);
}
.hover\:text-hover:hover {
  color: var(--text-hover-color);
}


  </style>
</head>

<body class="bg-body text-text">
  {% block content %}{% endblock %}

 <script>
  function toggleMobileMenu() {
    const menu = document.getElementById("mobile-menu");
    menu.classList.toggle("hidden");
  }
</script>

</body>
</html>
