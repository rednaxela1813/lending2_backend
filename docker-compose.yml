

services:
  web:
    build: .
    container_name: pizzalino-backend
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    

    depends_on:
      - db


  tailwind:
    image: node:18
    working_dir: /app
    volumes:
      - ./tailwind:/app
      - ./static:/static
      - ./templates:/app/backend_templates:ro
      
          
    command: sh -c "npm install && npm run build"
    


  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
